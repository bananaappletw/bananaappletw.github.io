name: Deploy to GitHub Pages

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    # src/pages/archives/index.astro groups posts with getFullYear()/getMonth()
    # on a bare Date, so without this the archive is a function of the runner's
    # clock rather than of the content. No post shifts today; this keeps it
    # that way, and makes a local run and a CI run agree.
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest and most specific first, so a bad commit fails in
      # under 30 seconds on the smallest possible diff. Everything here was
      # already installed and passing; none of it was ever run.
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
